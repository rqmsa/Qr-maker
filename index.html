<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُولّد رموز QR</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 20px; }
        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #5c67f2; }
        button {
            background-color: #5c67f2;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 96%;
            transition: background 0.3s;
        }
        button:hover { background-color: #4a55d4; }
        #qr-result { margin-top: 25px; display: none; }
        #qr-result img { max-width: 100%; height: auto; border: 1px solid #eee; padding: 10px; background: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>مُولّد الـ QR Code</h1>
    <p>أدخل الرابط أو النص الذي تريد تحويله:</p>
    <input type="text" id="qr-text" placeholder="اكتب الرابط هنا... (مثال: https://google.com)">
    <button onclick="generateQR()">إنشاء رمز QR</button>

    <div id="qr-result">
        <h3>الرمز الخاص بك جاهز:</h3>
        <img src="" id="qr-image" alt="QR Code">
    </div>
</div>

<script>
    function generateQR() {
        const qrText = document.getElementById('qr-text').value;
        const qrResult = document.getElementById('qr-result');
        const qrImage = document.getElementById('qr-image');

        if (qrText.trim() === '') {
            alert('من فضلك أدخل نصاً أو رابطاً أولاً!');
            return;
        }

        // استخدام API مجاني لتوليد الكود
        const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrText)}`;
        
        qrImage.src = apiUrl;
        qrResult.style.display = 'block';
    }
</script>

</body>
</html>
